<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cery's Birthday Game 🎮</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #fde2e4;
      --text: #6a4087;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--pink);
      color: var(--text);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: fixed;
    }

    /* Back Button */
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 1000;
      text-decoration: none;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.6);
      transform: translateX(-3px);
    }

    .back-icon {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
    }

    /* Game HUD overlay */
    #hud {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      z-index: 100;
      background: rgba(255,255,255,0.6);
      padding: 10px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 1.5px solid white;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #fde2e4 0%, #e8c3f5 100%);
    }

    /* Game success modal */
    #success-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(106, 64, 135, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
    }

    #success-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .success-card {
      background: white;
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      max-width: 380px;
      width: 90%;
      border: 4px solid #fde2e4;
      transform: scale(0.85);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #success-modal.active .success-card {
      transform: scale(1);
    }

    .success-icon {
      font-size: 4rem;
      margin-bottom: 15px;
      animation: bounce 2s infinite ease-in-out;
    }

    .success-card h2 {
      font-size: 1.7rem;
      margin-bottom: 10px;
      color: #8c5b9f;
    }

    .success-card p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #666;
      margin-bottom: 25px;
    }

    .success-btn {
      background: linear-gradient(135deg, #ffcfd2, #e8c3f5);
      color: white;
      font-weight: 700;
      border: none;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(140, 91, 159, 0.35);
      transition: all 0.3s;
    }

    .success-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(201, 107, 152, 0.5);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- Tombol Back -->
  <a class="back-button" href="plate-game.html">
    <svg class="back-icon" viewBox="0 0 24 24">
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
    <span>Back</span>
  </a>

  <!-- HUD overlay -->
  <div id="hud">
    <div>Skor: <span id="score-val">0</span>/18</div>
    <div id="hearts-container">❤️❤️❤️</div>
  </div>

  <!-- Game Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Success Modal -->
  <div id="success-modal">
    <div class="success-card">
      <div class="success-icon" id="success-emoji">🏆</div>
      <h2 id="success-title">Hebat Sekali!</h2>
      <p id="success-desc">Kamu berhasil menyelesaikan permainan ini dengan sangat baik!</p>
      <button class="success-btn" onclick="window.location.href='plate-game.html'">Kembali ke Game Room</button>
    </div>
  </div>

  <script>
    // Audio Synthesizer
    class GameAudio {
      constructor() {
        this.audioCtx = null;
      }
      init() {
        if (!this.audioCtx) {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playTone(freq, duration, type = 'sine') {
        this.init();
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);
        osc.start();
        osc.stop(this.audioCtx.currentTime + duration);
      }
      playPop() { this.playTone(550, 0.08, 'sine'); }
      playHit() { this.playTone(330, 0.12, 'triangle'); }
      playLoseHeart() { this.playTone(180, 0.25, 'sawtooth'); }
      playWin() {
        const t = 0.1;
        this.playTone(523, t, 'square');
        setTimeout(() => this.playTone(659, t, 'square'), t*1000);
        setTimeout(() => this.playTone(784, t, 'square'), t*2000);
        setTimeout(() => this.playTone(1046, t*3, 'square'), t*3000);
      }
    }

    const audio = new GameAudio();

    // Canvas settings
    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Detect game mode from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const isBalloonMode = urlParams.get("mode") === "balloon";

    let score = 0;
    let lives = 3;
    let gameOver = false;

    // Confetti particles
    let confettis = [];

    // Mode 1: Catcher Variables
    const basket = {
      x: canvas.width / 2 - 60,
      y: canvas.height - 80,
      width: 120,
      height: 25,
      speed: 12
    };

    let items = [];
    const itemEmojis = ["🍰", "🧁", "🎂", "🍬", "🍭", "🎁"];
    const dangerEmojis = ["💣", "🕷️", "☠️"];

    // Input state
    let leftPressed = false;
    let rightPressed = false;

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") leftPressed = true;
      if (e.key === "ArrowRight") rightPressed = true;
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft") leftPressed = false;
      if (e.key === "ArrowRight") rightPressed = false;
    });

    // Handle mouse/touch drag for mobile/desktop
    canvas.addEventListener("touchmove", (e) => {
      const touchX = e.touches[0].clientX;
      basket.x = touchX - basket.width / 2;
    });
    canvas.addEventListener("mousemove", (e) => {
      basket.x = e.clientX - basket.width / 2;
    });

    // Mode 2: Balloon Variables
    let balloons = [];
    const balloonColors = ["#ffd6ec", "#ffe5f1", "#e3f6f5", "#fff3b0", "#e5ccff", "#c77da5", "#926ca8"];

    // Tapping/clicking balloons
    canvas.addEventListener("mousedown", (e) => {
      if (isBalloonMode) handlePop(e.clientX, e.clientY);
    });
    canvas.addEventListener("touchstart", (e) => {
      if (isBalloonMode) {
        const touchX = e.touches[0].clientX;
        const touchY = e.touches[0].clientY;
        handlePop(touchX, touchY);
      }
    });

    function handlePop(x, y) {
      if (gameOver) return;
      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        const dist = Math.hypot(b.x - x, b.y - y);
        if (dist < b.radius + 15) {
          balloons.splice(i, 1);
          score++;
          document.getElementById("score-val").textContent = score;
          audio.playPop();
          spawnPopSparks(x, y);
          
          if (score >= 18) {
            triggerWin();
          }
          break;
        }
      }
    }

    let sparks = [];
    function spawnPopSparks(x, y) {
      for (let i = 0; i < 15; i++) {
        sparks.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          size: Math.random() * 5 + 2,
          color: balloonColors[Math.floor(Math.random() * balloonColors.length)],
          life: 1,
          decay: Math.random() * 0.04 + 0.02
        });
      }
    }

    function triggerWin() {
      gameOver = true;
      audio.playWin();
      
      // Setup Win Modal Info
      document.getElementById("success-emoji").textContent = isBalloonMode ? "🎈" : "🎂";
      document.getElementById("success-title").textContent = "Selamat, Cery! 🎉";
      document.getElementById("success-desc").textContent = isBalloonMode 
        ? "Kamu berhasil memecahkan 18 balon keberuntungan! Semoga segala harapan dan impianmu membumbung tinggi!" 
        : "Kamu berhasil menangkap 18 irisan kue manis untuk pesta ulang tahunmu! Semoga hari-harimu selalu manis dan ceria!";
      
      document.getElementById("success-modal").classList.add("active");

      // Spawn infinite confetti
      setInterval(() => {
        for (let i = 0; i < 10; i++) {
          confettis.push({
            x: Math.random() * canvas.width,
            y: -10,
            size: Math.random() * 7 + 4,
            color: balloonColors[Math.floor(Math.random() * balloonColors.length)],
            speed: Math.random() * 3 + 2,
            rot: Math.random() * 360,
            rotV: Math.random() * 8 - 4
          });
        }
      }, 100);
    }

    function triggerLose() {
      gameOver = true;
      audio.playLoseHeart();
      alert("Aduh! Permainan selesai, coba lagi ya! 💔");
      window.location.reload();
    }

    function spawnItem() {
      if (Math.random() < 0.02) {
        const isDanger = Math.random() < 0.25;
        items.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -30,
          emoji: isDanger ? dangerEmojis[Math.floor(Math.random() * dangerEmojis.length)] : itemEmojis[Math.floor(Math.random() * itemEmojis.length)],
          isDanger: isDanger,
          speed: Math.random() * 3 + 2.5
        });
      }
    }

    function spawnBalloon() {
      if (Math.random() < 0.035 && balloons.length < 15) {
        balloons.push({
          x: Math.random() * (canvas.width - 80) + 40,
          y: canvas.height + 40,
          radius: Math.random() * 15 + 25,
          color: balloonColors[Math.floor(Math.random() * balloonColors.length)],
          speed: Math.random() * 2 + 1.5,
          swing: Math.random() * 2,
          swingSpeed: Math.random() * 0.02 + 0.01,
          time: 0
        });
      }
    }

    // Main Game Loop
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        if (isBalloonMode) {
          spawnBalloon();
        } else {
          spawnItem();
        }
      }

      // 1. Draw and update Basket (Catcher Mode only)
      if (!isBalloonMode && !gameOver) {
        if (leftPressed && basket.x > 0) basket.x -= basket.speed;
        if (rightPressed && basket.x < canvas.width - basket.width) basket.x += basket.speed;

        // Draw Basket plate
        ctx.fillStyle = "#c96b98";
        ctx.beginPath();
        ctx.roundRect(basket.x, basket.y, basket.width, basket.height, 8);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "14px Poppins";
        ctx.textAlign = "center";
        ctx.fillText("PIRING KUE 🍽️", basket.x + basket.width / 2, basket.y + 17);
      }

      // 2. Draw and update falling items (Catcher Mode only)
      if (!isBalloonMode) {
        items.forEach((item, index) => {
          item.y += item.speed;
          
          // Draw item
          ctx.font = "2.5rem Poppins";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(item.emoji, item.x, item.y);

          // Check collision with basket
          if (item.y + 20 >= basket.y && item.y - 20 <= basket.y + basket.height &&
              item.x + 20 >= basket.x && item.x - 20 <= basket.x + basket.width) {
            
            items.splice(index, 1);
            if (item.isDanger) {
              lives--;
              audio.playLoseHeart();
              document.getElementById("hearts-container").textContent = "❤️".repeat(lives);
              if (lives <= 0) triggerLose();
            } else {
              score++;
              audio.playHit();
              document.getElementById("score-val").textContent = score;
              if (score >= 18) triggerWin();
            }
          }

          // Out of screen
          if (item.y > canvas.height + 40) {
            items.splice(index, 1);
            // If let safe cake fall, no penalty to keep it super fun!
          }
        });
      }

      // 3. Draw and update balloons (Balloon Mode only)
      if (isBalloonMode) {
        balloons.forEach((b, index) => {
          b.y -= b.speed;
          b.time += b.swingSpeed;
          b.x += Math.sin(b.time) * b.swing;

          // Draw balloon
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.ellipse(b.x, b.y, b.radius, b.radius * 1.25, 0, 0, Math.PI * 2);
          ctx.fill();
          
          // Draw balloon knot & string
          ctx.strokeStyle = "rgba(0,0,0,0.15)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(b.x, b.y + b.radius * 1.25);
          ctx.lineTo(b.x, b.y + b.radius * 1.25 + 10);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(b.x, b.y + b.radius * 1.25 + 10);
          ctx.bezierCurveTo(b.x - 5, b.y + b.radius * 1.25 + 20, b.x + 5, b.y + b.radius * 1.25 + 30, b.x, b.y + b.radius * 1.25 + 40);
          ctx.stroke();

          // Out of screen
          if (b.y < -b.radius * 1.5) {
            balloons.splice(index, 1);
            // Lose heart if let balloon escape
            lives--;
            audio.playLoseHeart();
            document.getElementById("hearts-container").textContent = "❤️".repeat(lives);
            if (lives <= 0) triggerLose();
          }
        });

        // Draw and update sparks
        sparks.forEach((s, index) => {
          s.x += s.vx;
          s.y += s.vy;
          s.life -= s.decay;
          if (s.life <= 0) {
            sparks.splice(index, 1);
          } else {
            ctx.save();
            ctx.globalAlpha = s.life;
            ctx.fillStyle = s.color;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        });
      }

      // 4. Draw win confetti
      confettis.forEach((p, index) => {
        p.y += p.speed;
        p.rot += p.rotV;
        if (p.y > canvas.height + 10) {
          confettis.splice(index, 1);
        } else {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        }
      });

      requestAnimationFrame(gameLoop);
    }

    // Start Loop
    gameLoop();
  </script>

</body>
</html>
