<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cery's Birthday Game Hub 🎮</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #fde2e4;
      --light-pink: #fff1f2;
      --text: #6a4087;
      --button-grad: linear-gradient(135deg, #ffcfd2, #e8c3f5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.3s ease;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #e8c3f5 0%, #ffcfd2 50%, #fde2e4 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Back Button */
    .back-button {
      position: fixed;
      top: 30px;
      left: 30px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      text-decoration: none;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.6);
      transform: translateX(-5px);
    }

    .back-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
    }

    header {
      text-align: center;
      padding: 80px 20px 20px;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      font-weight: 700;
      color: #3a1d2e;
    }

    header p {
      font-size: 0.95rem;
      color: #724c65;
    }

    /* Game cards grid container */
    .game-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      padding: 40px 20px 80px;
      flex-wrap: wrap;
    }

    .game-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 240px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 4px solid white;
    }

    .game-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(201, 107, 152, 0.25);
    }

    .game-art-placeholder {
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
      background: var(--light-pink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      box-shadow: 0 6px 15px rgba(0,0,0,0.06);
    }

    .game-info h2 {
      font-size: 1.15rem;
      color: #3a1d2e;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .game-info p {
      font-size: 0.8rem;
      color: #777;
      margin-bottom: 15px;
      line-height: 1.4;
      height: 40px;
    }

    .play-btn {
      display: inline-block;
      background: var(--button-grad);
      color: white;
      font-weight: 600;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.85rem;
      box-shadow: 0 4px 10px rgba(201, 107, 152, 0.3);
    }

    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(201, 107, 152, 0.45);
    }

    footer {
      width: 100%;
      text-align: center;
      padding: 20px;
      color: #8b6f47;
      font-size: 0.85rem;
      margin-top: auto;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.8rem; }
      .game-container {
        flex-direction: column;
        gap: 25px;
      }
      .game-card { width: 100%; max-width: 260px; }
    }
  </style>
</head>
<body>

  <!-- Tombol Back -->
  <a class="back-button" href="utama.html">
    <svg class="back-icon" viewBox="0 0 24 24">
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
    <span>Back</span>
  </a>

  <header>
    <h1>Cery's Game Room</h1>
    <p>Mainkan mini game ulang tahun yang asyik di bawah ini!</p>
  </header>

  <main class="game-container">
    
    <!-- Game Card 1: Cake Catcher -->
    <div class="game-card">
      <div class="game-art-placeholder">🍰</div>
      <div class="game-info">
        <h2>Cake Catcher</h2>
        <p>Tangkap sebanyak mungkin irisan kue yang jatuh!</p>
        <a class="play-btn" href="game.html">Main Sekarang</a>
      </div>
    </div>

    <!-- Game Card 2: Balloon Pop -->
    <div class="game-card">
      <div class="game-art-placeholder">🎈</div>
      <div class="game-info">
        <h2>Balloon Pop</h2>
        <p>Pecahkan balon ulang tahun sebelum waktu habis!</p>
        <a class="play-btn" href="game.html?mode=balloon">Main Sekarang</a>
      </div>
    </div>

  </main>

  <footer>
    Made with Love for Cery's Birthday ♥
  </footer>

</body>
</html>
